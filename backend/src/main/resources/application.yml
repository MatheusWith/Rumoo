spring:
  application:
    name: rumoo-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  error:
    include-message: always

logging:
  level:
    com.rumo: DEBUG
