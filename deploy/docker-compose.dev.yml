services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - keycloak

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
    command: ./mvnw spring-boot:run -Dspring-boot.run.fork=false
    restart: on-failure
    # Shares nginx's network namespace so `localhost:8080` resolves to nginx,
    # whose issuer URL (http://localhost:8080/auth/realms/Rumoo) then matches
    # the `iss` claim of browser-issued tokens. Backend binds 8081 internally.
    network_mode: service:nginx
    volumes:
      - ../backend/src:/app/src:ro
      - backend-m2:/root/.m2/repository
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/rumoo
      DB_USERNAME: ${DB_USERNAME:-rumoo}
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8080/auth}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-Rumoo}
      KEYCLOAK_BACKEND_CLIENT_ID: ${KEYCLOAK_BACKEND_CLIENT_ID:-rumoo-backend}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      nginx:
        condition: service_started

  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: dev
    volumes:
      - ../frontend/src:/app/src
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8080/auth}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-Rumoo}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-rumoo-frontend}
      CI: "true"

  keycloak:
    command: start-dev --import-realm

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rumoo
      POSTGRES_USER: ${DB_USERNAME:-rumoo}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rumoo}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  backend-m2:
