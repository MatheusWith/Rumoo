services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
    command: ./mvnw spring-boot:run -Dspring-boot.run.fork=false
    volumes:
      - ../backend/src:/app/src:ro
      - backend-m2:/root/.m2/repository
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/rumoo
      DB_USERNAME: ${DB_USERNAME:-rumoo}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: dev
    volumes:
      - ../frontend/src:/app/src:ro
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-Rumoo}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-rumoo-frontend}

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rumoo
      POSTGRES_USER: ${DB_USERNAME:-rumoo}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rumoo}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  backend-m2:
