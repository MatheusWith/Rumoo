# Dev overlay. Standalone COMPOSE file: inherits base service definitions via
# `extends` and only overrides what dev needs, so either
#   docker compose -f docker-compose.dev.yml up
# or the classic
#   docker compose -f docker-compose.base.yml -f docker-compose.dev.yml up
# works. Run from this directory (./.env provides DB_PASSWORD etc.).
services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - keycloak

  backend:
    extends:
      file: docker-compose.base.yml
      service: backend
    build:
      target: dev
    command: ./mvnw spring-boot:run -Dspring-boot.run.fork=false
    restart: on-failure
    # Shares nginx's network namespace so `localhost:8080` resolves to nginx,
    # whose issuer URL (http://localhost:8080/auth/realms/Rumoo) then matches
    # the `iss` claim of browser-issued tokens. Backend binds 8081 internally.
    network_mode: service:nginx
    volumes:
      - ../backend/src:/app/src:ro
      - backend-m2:/root/.m2/repository
    environment:
      SERVER_PORT: 8081
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8080/auth}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-Rumoo}
      KEYCLOAK_BACKEND_CLIENT_ID: ${KEYCLOAK_BACKEND_CLIENT_ID:-rumoo-backend}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      nginx:
        condition: service_started

  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: dev
    volumes:
      - ../frontend/src:/app/src
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8080/auth}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-Rumoo}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-rumoo-frontend}
      CI: "true"

  keycloak:
    extends:
      file: docker-compose.base.yml
      service: keycloak
    command: start-dev --import-realm

  postgres:
    extends:
      file: docker-compose.base.yml
      service: postgres
    ports:
      - "5432:5432"

volumes:
  pgdata:
  backend-m2: