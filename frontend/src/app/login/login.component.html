<div class="flex flex-col items-center gap-4 pt-16">
  <h2 class="title">Sign in to Rumoo</h2>
  <button
    type="button"
    (click)="onSignIn()"
    [disabled]="signingIn()"
    class="rounded bg-gray-800 px-4 py-2 text-white"
  >
    {{ signingIn() ? 'Redirecting…' : 'Sign in with Keycloak' }}
  </button>
</div>
